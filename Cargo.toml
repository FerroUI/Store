[package]
name = "ferro-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Discover and run apps built with FerroUI"

[[bin]]
name = "ferro-store"
path = "src/main.rs"

[dependencies]
ferroui-base = { path = "vendor/FerroUI/src/FerroUI.Base" }
ferroui-controls = { path = "vendor/FerroUI/src/FerroUI.Controls" }
ferroui-browser = { path = "vendor/FerroUI/src/Browser/FerroUI.Browser" }
ferroui-themes-winui = { path = "vendor/FerroUI/src/FerroUI.Themes.WinUI" }
ferroui-fonts-inter = { path = "vendor/FerroUI/src/FerroUI.Fonts.Inter" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.browser]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.browser.package.ferroui-base]
opt-level = "s"
[profile.browser.package.ferroui-controls]
opt-level = "s"
